name: e2e
on:
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.read.outputs.kind }}
      k8s: ${{ steps.read.outputs.k8s }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          echo "kind=$(jq -r .kind kubernetes-versions.json)" >> "$GITHUB_OUTPUT"
          echo "k8s=$(jq -c .kubernetes kubernetes-versions.json)" >> "$GITHUB_OUTPUT"
      - name: README lists the same versions
        # 末尾の空行まで含めて比べ、README 側にだけ余計なバージョンがある場合も落とす
        run: |
          want="$(jq -r '"Tested Kubernetes versions:\n\n" + (.kubernetes | map("- " + .) | join("\n"))' kubernetes-versions.json)"
          [[ "$(cat README.md)" == *"$want"$'\n\n'* ]] || { echo "::error file=README.md::update the list to match kubernetes-versions.json"; echo "$want"; exit 1; }

  e2e:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        k8s: ${{ fromJSON(needs.versions.outputs.k8s) }}
    # 記録済みの出力は Docker Desktop (arm64) の kind クラスタを前提にしている。
    # ノード名・ラベルを揃えないと DRIFT になる。出力は kubernetes-versions.json の
    # 先頭のバージョンで記録し、他のバージョンとの差は lab.yaml の mask で吸収する
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: helm/kind-action@v1
        with:
          version: ${{ needs.versions.outputs.kind }}
          node_image: kindest/node:${{ matrix.k8s }}
          cluster_name: desktop
          kubectl_version: ${{ matrix.k8s }}
      - run: kubectl config rename-context kind-desktop docker-desktop
      # 教材は macOS の base64 前提。GNU base64 は 76 文字で折り返す
      - run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec /usr/bin/base64 -w0 "$@"\n' > "$RUNNER_TEMP/bin/base64"
          chmod +x "$RUNNER_TEMP/bin/base64"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: labs
        run: |
          mapfile -t dirs < <(find . -path '*/.lab/lab.yaml' -printf '%h\n' | xargs -I{} dirname {} | sort)
          uv run scripts/labs.py check "${dirs[@]}"
          uv run scripts/labs.py run "${dirs[@]}"
