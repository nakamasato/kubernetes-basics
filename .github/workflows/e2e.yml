name: kind e2e
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test selection
        run: python3 -m unittest discover -s e2e -p 'test_*.py'
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            targets=$(python3 e2e/run.py --select "$BASE")
          else
            targets=$(python3 -c 'import json; from e2e.run import TARGETS; print(json.dumps(list(TARGETS)))')
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Selected suites: $targets" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: select
    if: needs.select.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
      - run: python3 e2e/run.py "${{ matrix.target }}"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: e2e-${{ matrix.target }}
          path: e2e-artifacts/

  e2e-result:
    if: always()
    needs: [select, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selection and selected suites
        env:
          SELECT: ${{ needs.select.result }}
          E2E: ${{ needs.e2e.result }}
          TARGETS: ${{ needs.select.outputs.targets }}
        run: |
          test "$SELECT" = success
          if [ "$TARGETS" = '[]' ]; then
            test "$E2E" = skipped
          else
            test "$E2E" = success
          fi
