            Labels:           run=nginx
            Annotations:      <none>
            Status:           Pending
            IP:
            IPs:              <none>
            Containers:
              nginx:
                Image:        nginx
                Port:         <none>
                Host Port:    <none>
                Environment:  <none>
                Mounts:
                  /var/run/secrets/kubernetes.io/serviceaccount from kube-api-access-c857t (ro)
            Conditions:
